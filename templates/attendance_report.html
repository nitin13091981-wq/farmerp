<!DOCTYPE html>

<html>

<head>
    <title>Attendance Report</title>

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
```

</head>

<body class="container mt-4">
{% include 'navbar.html' %}
<h2>📊 Attendance Report</h2>


<form method="GET" class="row mb-4">

```
<div class="col-md-4">
    <label>From Date</label>
    <input
    type="date"
    name="from_date"
    value="{{ from_date }}"
    class="form-control">
</div>

<div class="col-md-4">
    <label>To Date</label>
    <input
    type="date"
    name="to_date"
    value="{{ to_date }}"
    class="form-control">
</div>

<div class="col-md-4">
    <label>Farm Sahayogi</label>

    <select name="employee" class="form-control">

        <option value="">
            Sabhi Farm Sahayogi
        </option>

        {% for emp in employees %}
        <option value="{{ emp.id }}">
            {{ emp.name }}
        </option>
        {% endfor %}

    </select>
</div>
<div class="col-md-4">
    <br>
    <button class="btn btn-success">
        Show Report
    </button>
</div>
```

</form>

<table class="table table-bordered">

```
<thead>
    <tr>
        <th>Farm Sahayogi</th>
        <th>Days</th>
        <th>Daily Wage</th>
        <th>Amount</th>
    </tr>
</thead>

<tbody>

{% for row in report %}

    <tr>
        <td>{{ row.name }}</td>
        <td>{{ row.days }}</td>
        <td>{{ row.wage }}</td>
        <td>{{ row.amount }}</td>
    </tr>

{% endfor %}

</tbody>
```
<tr class="table-success">
    <td colspan="3">
        <strong>Total Payment</strong>
    </td>

    <td>
        <strong>₹ {{ total_amount }}</strong>
    </td>
</tr>
</table>

</body>
</html>
