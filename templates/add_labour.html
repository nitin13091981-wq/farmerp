<!DOCTYPE html>

<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

```
<title>Farm Sahayogi Joden</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
```

</head>

<body class="bg-light">

<div class="container">
{% include 'navbar.html' %}
<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow mt-5 border-0">

            <div class="card-body p-4">

                <h2 class="text-center text-success mb-4">
                    🌾 Farm Sahayogi Joden
                </h2>

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Naam
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Farm Sahayogi ka naam"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Mobile Number (Optional)
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            placeholder="9876543210"
                        >

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Dihadi / Daily Wage (₹)
                        </label>

                        <input
                            type="number"
                            name="wage"
                            class="form-control"
                            placeholder="500"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success w-100">
                        💾 Save Farm Sahayogi
                    </button>

                </form>
            </div>

        </div>

    </div>

</div>
```

</div>

</body>
</html>
