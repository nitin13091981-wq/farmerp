<!DOCTYPE html>

<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>उपस्थिति संशोधन</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

{% include 'navbar.html' %}

<div class="container py-4">


<div class="text-center mb-4">

    <h2 class="fw-bold text-success">
        ✏️ उपस्थिति संशोधन
    </h2>

    <p class="text-muted">
        कृषि सहयोगी की उपस्थिति एवं पारिश्रमिक में संशोधन करें।
    </p>

</div>

<div class="card shadow border-0">

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label fw-bold">
                    👨‍🌾 कृषि सहयोगी
                </label>

                <input
                    type="text"
                    class="form-control"
                    value="{{ attendance.employee.name }}"
                    readonly
                >

            </div>

            <div class="mb-3">

                <label class="form-label fw-bold">
                    📅 तिथि
                </label>

                <input
                    type="date"
                    name="date"
                    value="{{ attendance.date|date:'Y-m-d' }}"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label fw-bold">
                    📌 उपस्थिति स्थिति
                </label>

                <select
                    name="status"
                    class="form-select"
                >

                    <option value="full"
                    {% if attendance.status == 'full' %}selected{% endif %}>
                        पूर्ण दिवस
                    </option>

                    <option value="half"
                    {% if attendance.status == 'half' %}selected{% endif %}>
                        अर्ध दिवस
                    </option>

                    <option value="absent"
                    {% if attendance.status == 'absent' %}selected{% endif %}>
                        अनुपस्थित
                    </option>

                    <option value="leave"
                    {% if attendance.status == 'leave' %}selected{% endif %}>
                        अवकाश
                    </option>

                    <option value="holiday"
                    {% if attendance.status == 'holiday' %}selected{% endif %}>
                        अवकाश दिवस
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label fw-bold">
                    ₹ आज का पारिश्रमिक
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="actual_wage"
                    value="{{ attendance.actual_wage }}"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label fw-bold">
                    📝 टिप्पणी
                </label>

                <textarea
                    name="notes"
                    class="form-control"
                    rows="3"
                >{{ attendance.notes }}</textarea>

            </div>

            <button
                type="submit"
                class="btn btn-success btn-lg w-100"
            >
                💾 संशोधन सुरक्षित करें
            </button>

        </form>

    </div>

</div>

<div class="alert alert-success mt-4">

    🌾 प्रत्येक सहयोगी का सम्मान, पारदर्शिता और उचित पारिश्रमिक हमारी प्राथमिकता है।

</div>


</div>

</body>

</html>
